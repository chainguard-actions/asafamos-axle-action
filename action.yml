name: "axle — a11y / WCAG Accessibility CI"
description: "a11y + WCAG 2.2 AA scanner for every PR. Blocks merges on accessibility regressions. AI code fixes via Claude. Built for EAA 2025, ADA, Section 508. Not an overlay widget."
author: "axle"
branding:
  icon: shield
  color: green
inputs:
  url:
    description: "URL to scan. When empty (default), the Action uses install-command + build-command + start-command to run the project locally and scans http://localhost:<wait-on-port>."
    required: false
    default: ""
  fail-on:
    description: "Severity threshold that fails the build. One of: critical | serious | moderate | minor | none. Default: serious."
    required: false
    default: "serious"
  with-ai-fixes:
    description: "If true, Claude Sonnet proposes a code-fix diff for each violation and embeds it in the PR comment. Requires anthropic-api-key."
    required: false
    default: "false"
  max-ai-fixes:
    description: "Upper bound on AI fix calls per run (cost guard). Default: 10."
    required: false
    default: "10"
  anthropic-api-key:
    description: "Anthropic API key used when with-ai-fixes is true. Pass as a repository secret; never hardcode."
    required: false
  anthropic-model:
    description: "Claude model ID used for fix generation. Default: claude-sonnet-4-6."
    required: false
    default: "claude-sonnet-4-6"
  github-token:
    description: "Token used to post the PR summary comment. Default: github.token (requires pull-requests: write permission on the workflow)."
    required: false
    default: ${{ github.token }}
  comment-on-pr:
    description: "If true (default), post/update a sticky comment on the PR with the scan summary and (when enabled) AI fix diffs."
    required: false
    default: "true"
  install-command:
    description: "Shell command to install dependencies before building locally (used only when url is empty). Default: npm ci."
    required: false
    default: "npm ci"
  build-command:
    description: "Shell command to build the project locally (used only when url is empty). Default: npm run build."
    required: false
    default: "npm run build"
  start-command:
    description: "Shell command to start the server locally (used only when url is empty). Default: npm start."
    required: false
    default: "npm start"
  wait-on-port:
    description: "Port to wait for before running the scan against localhost (used only when url is empty). Default: 3000."
    required: false
    default: "3000"
outputs:
  json-path:
    description: "Absolute filesystem path to the machine-readable JSON scan report."
    value: ${{ steps.run.outputs.json-path }}
  markdown-path:
    description: "Absolute filesystem path to the human-readable Markdown scan report."
    value: ${{ steps.run.outputs.markdown-path }}
  failing:
    description: "'true' when at least one violation at or above fail-on severity was found, 'false' otherwise."
    value: ${{ steps.run.outputs.failing }}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - uses: chainguard-actions/actions-setup-node@031fc9bd73e651da81e6a7294b2af29e64d5f39c # v4
      with:
        node-version: "22"
    - name: Resolve axle CLI package root
      id: axle-pkg
      shell: bash
      run: |
        # Composite actions expose their own source tree via GITHUB_ACTION_PATH.
        # The CLI bundle ships next to this action.yml under ./cli.
        safe=$(printf '%s' "$GITHUB_ACTION_PATH" | tr -d '\n\r')
        echo "dir=${safe}/cli" >> "$GITHUB_OUTPUT"
    - name: Install axle CLI dependencies
      shell: bash
      working-directory: ${{ steps.axle-pkg.outputs.dir }}
      run: npm ci --omit=optional
    - name: Cache Playwright browsers
      id: pw
      uses: chainguard-actions/actions-cache@1a492a110f951652a0d2d3327bc20ee36867788e # v4
      with:
        path: ~/.cache/ms-playwright
        key: axle-playwright-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', steps.axle-pkg.outputs.dir)) }}
    - name: Install Chromium (cache miss)
      if: steps.pw.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.axle-pkg.outputs.dir }}
      run: npx playwright install chromium --with-deps
    - name: Install Chromium system deps (cache hit)
      if: steps.pw.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ steps.axle-pkg.outputs.dir }}
      run: npx playwright install-deps chromium
    - name: Build + start host project (when url is empty)
      if: inputs.url == ''
      shell: bash
      env:
        INPUT_INSTALL_COMMAND: ${{ inputs.install-command }}
        INPUT_BUILD_COMMAND: ${{ inputs.build-command }}
        INPUT_START_COMMAND: ${{ inputs.start-command }}
        INPUT_WAIT_ON_PORT: ${{ inputs.wait-on-port }}
      run: |
        install_cmd=(); build_cmd=(); start_cmd=()
        if [ -n "$INPUT_INSTALL_COMMAND" ]; then
          while IFS= read -r -d '' t; do install_cmd+=("$t"); done \
            < <(printf '%s' "$INPUT_INSTALL_COMMAND" | xargs printf '%s\0')
        fi
        if [ -n "$INPUT_BUILD_COMMAND" ]; then
          while IFS= read -r -d '' t; do build_cmd+=("$t"); done \
            < <(printf '%s' "$INPUT_BUILD_COMMAND" | xargs printf '%s\0')
        fi
        if [ -n "$INPUT_START_COMMAND" ]; then
          while IFS= read -r -d '' t; do start_cmd+=("$t"); done \
            < <(printf '%s' "$INPUT_START_COMMAND" | xargs printf '%s\0')
        fi
        "${install_cmd[@]}"
        "${build_cmd[@]}"
        nohup "${start_cmd[@]}" > axle-server.log 2>&1 &
        echo $! > axle-server.pid
        npx --yes wait-on "http://localhost:$INPUT_WAIT_ON_PORT" --timeout 90000
    - name: Scan
      id: run
      shell: bash
      working-directory: ${{ steps.axle-pkg.outputs.dir }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic-model }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_WAIT_ON_PORT: ${{ inputs.wait-on-port }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_WITH_AI_FIXES: ${{ inputs.with-ai-fixes }}
        INPUT_MAX_AI_FIXES: ${{ inputs.max-ai-fixes }}
      run: |
        TARGET="$INPUT_URL"
        if [ -z "$TARGET" ]; then
          TARGET="http://localhost:$INPUT_WAIT_ON_PORT"
        fi
        set +e
        node dist/axle.js scan "$TARGET" \
          --fail-on "$INPUT_FAIL_ON" \
          --with-ai-fixes "$INPUT_WITH_AI_FIXES" \
          --max-ai-fixes "$INPUT_MAX_AI_FIXES" \
          --json-out "$GITHUB_WORKSPACE/axle-report.json" \
          --markdown-out "$GITHUB_WORKSPACE/axle-report.md"
        rc=$?
        set -e
        echo "json-path=$GITHUB_WORKSPACE/axle-report.json" >> "$GITHUB_OUTPUT"
        echo "markdown-path=$GITHUB_WORKSPACE/axle-report.md" >> "$GITHUB_OUTPUT"
        if [ $rc -eq 1 ]; then
          echo "failing=true" >> "$GITHUB_OUTPUT"
        else
          echo "failing=false" >> "$GITHUB_OUTPUT"
        fi
        exit $rc
    - name: Stop host project
      if: always() && inputs.url == ''
      shell: bash
      run: |
        if [ -f axle-server.pid ]; then
          kill "$(cat axle-server.pid)" 2>/dev/null || true
        fi
    - name: Upload report
      if: always()
      uses: chainguard-actions/actions-upload-artifact@61ae9717c37cd5ac5fcaa5599c0dab961d043ecc # v4
      with:
        name: axle-report-${{ github.run_id }}
        path: |
          axle-report.json
          axle-report.md
          axle-server.log
    - name: Comment on PR
      if: always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      uses: chainguard-actions/actions-github-script@c016e3163cf6a74fc76e781c8239af596ae9b9b7 # v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const p = `${process.env.GITHUB_WORKSPACE}/axle-report.md`;
          if (!fs.existsSync(p)) {
            core.warning("axle: no report to comment with");
            return;
          }
          const body = fs.readFileSync(p, "utf8");
          const marker = "<!-- axle-report -->";
          const fullBody = `${marker}\n${body}`;
          const { data: comments } = await github.rest.issues.listComments({
            ...context.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((c) => c.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: fullBody,
            });
          }
