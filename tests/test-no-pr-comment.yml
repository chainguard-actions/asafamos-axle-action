name: Test scan without PR comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          url: "https://example.com"
          fail-on: "none"
          comment-on-pr: "false"
          with-ai-fixes: "false"

      - name: Assert outputs are populated
        env:
          JSON_PATH: ${{ steps.action.outputs.json-path }}
          MD_PATH: ${{ steps.action.outputs.markdown-path }}
          FAILING: ${{ steps.action.outputs.failing }}
        run: |
          echo "json-path: $JSON_PATH"
          echo "markdown-path: $MD_PATH"
          echo "failing: $FAILING"

          if [ -z "$JSON_PATH" ]; then
            echo "FAIL: json-path is empty"
            exit 1
          fi
          if [ -z "$MD_PATH" ]; then
            echo "FAIL: markdown-path is empty"
            exit 1
          fi
          if [ -z "$FAILING" ]; then
            echo "FAIL: failing is empty"
            exit 1
          fi
          echo "PASS: all outputs are set"

      - name: Assert markdown report is non-empty
        env:
          MD_PATH: ${{ steps.action.outputs.markdown-path }}
        run: |
          echo "checking markdown at: $MD_PATH"
          if [ ! -f "$MD_PATH" ]; then
            echo "FAIL: Markdown report not found at $MD_PATH"
            exit 1
          fi
          SIZE=$(wc -c < "$MD_PATH")
          echo "Markdown report size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: Markdown report is empty"
            exit 1
          fi
          echo "PASS: Markdown report is non-empty ($SIZE bytes)"
