name: Test anthropic-api-key input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "https://example.com"
          fail-on: "none"
          with-ai-fixes: "true"
          anthropic-api-key: "sk-ant-test-fake-key-for-coverage"
          max-ai-fixes: "1"
          comment-on-pr: "false"

      - name: Assert outputs are set or action failed gracefully
        env:
          JSON_PATH: ${{ steps.action.outputs.json-path }}
          MD_PATH: ${{ steps.action.outputs.markdown-path }}
          FAILING: ${{ steps.action.outputs.failing }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json-path: $JSON_PATH"
          echo "markdown-path: $MD_PATH"
          echo "failing: $FAILING"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_PATH" ]; then
              echo "FAIL: json-path output is empty"
              exit 1
            fi
            if [ -z "$MD_PATH" ]; then
              echo "FAIL: markdown-path output is empty"
              exit 1
            fi
            if [ -z "$FAILING" ]; then
              echo "FAIL: failing output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with anthropic-api-key input set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake API key rejected by Anthropic, which is expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
