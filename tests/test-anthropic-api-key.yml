name: Test anthropic-api-key input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "https://example.com"
          fail-on: "none"
          with-ai-fixes: "false"
          anthropic-api-key: "sk-ant-test-placeholder"
          max-ai-fixes: "0"
          comment-on-pr: "false"

      - name: Assert action ran and outputs are set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILING: ${{ steps.action.outputs.failing }}
          JSON_PATH: ${{ steps.action.outputs.json-path }}
          MD_PATH: ${{ steps.action.outputs.markdown-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failing: $FAILING"
          echo "json-path: $JSON_PATH"
          echo "md-path: $MD_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_PATH" ]; then
              echo "FAIL: json-path output is empty"
              exit 1
            fi
            if [ -z "$MD_PATH" ]; then
              echo "FAIL: markdown-path output is empty"
              exit 1
            fi
            if [ "$FAILING" != "true" ] && [ "$FAILING" != "false" ]; then
              echo "FAIL: failing output has unexpected value: $FAILING"
              exit 1
            fi
            echo "PASS: action succeeded with anthropic-api-key input covered"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable under harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
