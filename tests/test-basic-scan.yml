name: Test basic scan with public URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run axle scan against example.com
        id: action
        uses: .
        with:
          url: "https://example.com"
          fail-on: "none"
          comment-on-pr: "false"
          with-ai-fixes: "false"

      - name: Assert json-path output is set
        env:
          JSON_PATH: ${{ steps.action.outputs.json-path }}
        run: |
          echo "json-path: $JSON_PATH"
          if [ -z "$JSON_PATH" ]; then
            echo "FAIL: json-path output is empty"
            exit 1
          fi
          echo "PASS: json-path is set to $JSON_PATH"

      - name: Assert markdown-path output is set
        env:
          MD_PATH: ${{ steps.action.outputs.markdown-path }}
        run: |
          echo "markdown-path: $MD_PATH"
          if [ -z "$MD_PATH" ]; then
            echo "FAIL: markdown-path output is empty"
            exit 1
          fi
          echo "PASS: markdown-path is set to $MD_PATH"

      - name: Assert failing output is set
        env:
          FAILING: ${{ steps.action.outputs.failing }}
        run: |
          echo "failing: $FAILING"
          if [ "$FAILING" != "true" ] && [ "$FAILING" != "false" ]; then
            echo "FAIL: failing output must be 'true' or 'false', got: $FAILING"
            exit 1
          fi
          echo "PASS: failing output is a valid boolean string: $FAILING"

      - name: Assert JSON report file exists
        env:
          JSON_PATH: ${{ steps.action.outputs.json-path }}
        run: |
          echo "Checking for JSON report at: $JSON_PATH"
          if [ ! -f "$JSON_PATH" ]; then
            echo "FAIL: JSON report file not found at $JSON_PATH"
            exit 1
          fi
          echo "PASS: JSON report file exists"

      - name: Assert Markdown report file exists
        env:
          MD_PATH: ${{ steps.action.outputs.markdown-path }}
        run: |
          echo "Checking for Markdown report at: $MD_PATH"
          if [ ! -f "$MD_PATH" ]; then
            echo "FAIL: Markdown report file not found at $MD_PATH"
            exit 1
          fi
          echo "PASS: Markdown report file exists"
