name: Test fail-on none produces failing=false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run axle scan with fail-on none
        id: action
        uses: .
        with:
          url: "https://example.com"
          fail-on: "none"
          comment-on-pr: "false"
          with-ai-fixes: "false"

      - name: Assert failing is false when fail-on is none
        env:
          FAILING: ${{ steps.action.outputs.failing }}
        run: |
          echo "failing: $FAILING"
          if [ "$FAILING" != "false" ]; then
            echo "FAIL: expected failing=false when fail-on=none, got: $FAILING"
            exit 1
          fi
          echo "PASS: failing=false as expected with fail-on=none"
